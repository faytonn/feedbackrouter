services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Local_dev_only_1}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FeedbackRouter: Server=sql,1433;Database=FeedbackRouter;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_dev_only_1};TrustServerCertificate=True
      Seed__Path: /seed/feedback.json
    # Optional: Llm__ApiKey, Llm__Endpoint, AzureDevOps__Pat and friends.
    env_file:
      - path: .env
        required: false
    ports:
      - "5080:8080"
    volumes:
      - ./seed:/seed:ro
    depends_on:
      sql:
        condition: service_healthy

volumes:
  sqldata:
